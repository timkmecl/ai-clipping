version: '3.8'

services:
  backend:
    image: ghcr.io/timkmecl/ai-clipping-backend:latest
    container_name: ai-clipping-backend
    ports:
      - "4102:4102"
    environment:
      - NODE_ENV=production
      - PORT=4102
      - DATA_DIR=/app/data
    env_file:
      - .env
    volumes:
      - /home/pi/apps/ai-clipping-zppkz-process/data:/app/data:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4102/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: ai-clipping-network